server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index intranet.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://intranet-api:8001; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://intranet-api:8001; }
  location / { try_files $uri $uri/ /intranet.html; }
}
